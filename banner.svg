<svg width="1500" height="400" viewBox="0 0 1500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mc { font-family:'Courier New',Courier,monospace; font-size:13px; }
      @keyframes f1 { 0%,100%{opacity:0.04} 40%{opacity:0.32} }
      @keyframes f2 { 0%,100%{opacity:0.07} 55%{opacity:0.26} }
      @keyframes f3 { 0%,100%{opacity:0.03} 30%{opacity:0.38} }
      @keyframes blk { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    </style>
    <clipPath id="cr">
      <rect x="0" y="100" height="200" width="0">
        <animate attributeName="width" from="0" to="1500" dur="1.4s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1500" height="400" fill="#0d1117"/>

  <!-- macOS dots -->
  <circle cx="28" cy="24" r="7" fill="#FF5F57"/>
  <circle cx="50" cy="24" r="7" fill="#FFBD2E"/>
  <circle cx="72" cy="24" r="7" fill="#28C840"/>

  <!-- Matrix rain — LEFT zone -->
  <text class="mc" fill="#22c55e" x="40"  y="45"  style="animation:f1 3.2s infinite 0.0s">2</text>
  <text class="mc" fill="#22c55e" x="40"  y="95"  style="animation:f2 4.1s infinite 0.5s">h</text>
  <text class="mc" fill="#22c55e" x="40"  y="155" style="animation:f3 3.7s infinite 1.0s">7</text>
  <text class="mc" fill="#22c55e" x="40"  y="230" style="animation:f1 4.4s infinite 0.3s">m</text>
  <text class="mc" fill="#22c55e" x="40"  y="300" style="animation:f2 3.0s infinite 0.8s">p</text>
  <text class="mc" fill="#22c55e" x="40"  y="360" style="animation:f3 4.6s infinite 0.1s">1</text>

  <text class="mc" fill="#22c55e" x="100" y="70"  style="animation:f2 3.5s infinite 0.7s">n</text>
  <text class="mc" fill="#22c55e" x="100" y="130" style="animation:f1 4.3s infinite 1.2s">5</text>
  <text class="mc" fill="#22c55e" x="100" y="200" style="animation:f3 3.9s infinite 0.4s">x</text>
  <text class="mc" fill="#22c55e" x="100" y="265" style="animation:f2 4.7s infinite 0.9s">3</text>
  <text class="mc" fill="#22c55e" x="100" y="330" style="animation:f1 3.4s infinite 0.2s">w</text>

  <text class="mc" fill="#22c55e" x="160" y="50"  style="animation:f3 4.0s infinite 1.5s">8</text>
  <text class="mc" fill="#22c55e" x="160" y="115" style="animation:f1 3.3s infinite 0.6s">c</text>
  <text class="mc" fill="#22c55e" x="160" y="185" style="animation:f2 4.9s infinite 0.3s">4</text>
  <text class="mc" fill="#22c55e" x="160" y="255" style="animation:f3 3.6s infinite 1.1s">z</text>
  <text class="mc" fill="#22c55e" x="160" y="325" style="animation:f1 4.2s infinite 0.7s">9</text>
  <text class="mc" fill="#22c55e" x="160" y="375" style="animation:f2 3.8s infinite 1.4s">v</text>

  <text class="mc" fill="#22c55e" x="215" y="60"  style="animation:f2 3.9s infinite 0.2s">k</text>
  <text class="mc" fill="#22c55e" x="215" y="140" style="animation:f3 4.3s infinite 0.8s">0</text>
  <text class="mc" fill="#22c55e" x="215" y="210" style="animation:f1 3.4s infinite 1.3s">j</text>
  <text class="mc" fill="#22c55e" x="215" y="280" style="animation:f2 4.8s infinite 0.5s">6</text>
  <text class="mc" fill="#22c55e" x="215" y="355" style="animation:f3 3.2s infinite 1.0s">r</text>

  <text class="mc" fill="#22c55e" x="270" y="80"  style="animation:f1 4.5s infinite 0.4s">d</text>
  <text class="mc" fill="#22c55e" x="270" y="160" style="animation:f2 3.1s infinite 1.2s">0</text>
  <text class="mc" fill="#22c55e" x="270" y="240" style="animation:f3 4.0s infinite 0.6s">8</text>
  <text class="mc" fill="#22c55e" x="270" y="310" style="animation:f1 3.6s infinite 0.9s">n</text>
  <text class="mc" fill="#22c55e" x="270" y="375" style="animation:f2 4.4s infinite 1.4s">1</text>

  <!-- Matrix rain — RIGHT zone -->
  <text class="mc" fill="#22c55e" x="1230" y="55"  style="animation:f1 3.8s infinite 0.4s">2</text>
  <text class="mc" fill="#22c55e" x="1230" y="115" style="animation:f2 4.4s infinite 0.9s">m</text>
  <text class="mc" fill="#22c55e" x="1230" y="185" style="animation:f3 3.1s infinite 1.6s">7</text>
  <text class="mc" fill="#22c55e" x="1230" y="255" style="animation:f1 4.6s infinite 0.2s">y</text>
  <text class="mc" fill="#22c55e" x="1230" y="325" style="animation:f2 3.3s infinite 1.1s">4</text>

  <text class="mc" fill="#22c55e" x="1290" y="80"  style="animation:f3 4.1s infinite 0.6s">d</text>
  <text class="mc" fill="#22c55e" x="1290" y="150" style="animation:f1 3.7s infinite 1.3s">0</text>
  <text class="mc" fill="#22c55e" x="1290" y="220" style="animation:f2 4.9s infinite 0.1s">8</text>
  <text class="mc" fill="#22c55e" x="1290" y="295" style="animation:f3 3.5s infinite 0.7s">n</text>
  <text class="mc" fill="#22c55e" x="1290" y="360" style="animation:f1 4.2s infinite 1.4s">1</text>

  <text class="mc" fill="#22c55e" x="1345" y="50"  style="animation:f2 3.6s infinite 0.3s">v</text>
  <text class="mc" fill="#22c55e" x="1345" y="120" style="animation:f3 4.0s infinite 0.8s">3</text>
  <text class="mc" fill="#22c55e" x="1345" y="195" style="animation:f1 3.9s infinite 1.5s">w</text>
  <text class="mc" fill="#22c55e" x="1345" y="270" style="animation:f2 4.5s infinite 0.4s">5</text>
  <text class="mc" fill="#22c55e" x="1345" y="345" style="animation:f3 3.2s infinite 1.2s">p</text>

  <text class="mc" fill="#22c55e" x="1400" y="70"  style="animation:f1 4.3s infinite 0.6s">c</text>
  <text class="mc" fill="#22c55e" x="1400" y="140" style="animation:f2 3.8s infinite 1.0s">9</text>
  <text class="mc" fill="#22c55e" x="1400" y="215" style="animation:f3 4.7s infinite 0.5s">x</text>
  <text class="mc" fill="#22c55e" x="1400" y="285" style="animation:f1 3.4s infinite 1.3s">z</text>
  <text class="mc" fill="#22c55e" x="1400" y="360" style="animation:f2 4.1s infinite 0.2s">k</text>

  <text class="mc" fill="#22c55e" x="1458" y="55"  style="animation:f3 3.9s infinite 0.9s">h</text>
  <text class="mc" fill="#22c55e" x="1458" y="130" style="animation:f1 4.5s infinite 0.3s">6</text>
  <text class="mc" fill="#22c55e" x="1458" y="205" style="animation:f2 3.3s infinite 1.5s">r</text>
  <text class="mc" fill="#22c55e" x="1458" y="280" style="animation:f3 4.8s infinite 0.7s">j</text>
  <text class="mc" fill="#22c55e" x="1458" y="355" style="animation:f1 3.6s infinite 1.1s">2</text>

  <!-- Very faint scattered middle chars -->
  <text class="mc" fill="#22c55e" x="400"  y="55"  style="animation:f1 3.5s infinite 0.7s;opacity:0.05">4</text>
  <text class="mc" fill="#22c55e" x="500"  y="80"  style="animation:f2 4.2s infinite 1.1s;opacity:0.04">h</text>
  <text class="mc" fill="#22c55e" x="960"  y="60"  style="animation:f3 3.9s infinite 0.3s;opacity:0.05">7</text>
  <text class="mc" fill="#22c55e" x="1080" y="90"  style="animation:f1 4.6s infinite 0.8s;opacity:0.04">m</text>
  <text class="mc" fill="#22c55e" x="420"  y="340" style="animation:f2 3.3s infinite 1.4s;opacity:0.05">2</text>
  <text class="mc" fill="#22c55e" x="550"  y="360" style="animation:f3 4.0s infinite 0.6s;opacity:0.04">n</text>
  <text class="mc" fill="#22c55e" x="980"  y="350" style="animation:f1 3.7s infinite 1.2s;opacity:0.05">5</text>
  <text class="mc" fill="#22c55e" x="1100" y="340" style="animation:f2 4.4s infinite 0.4s;opacity:0.04">v</text>

  <!-- LOGESH — typewriter reveal via clipPath -->
  <text
    x="750" y="235"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="100"
    fill="#ffffff"
    text-anchor="middle"
    clip-path="url(#cr)">LOGESH</text>

  <!-- Subtitle — fades in after reveal -->
  <text
    x="750" y="290"
    font-family="'Courier New',Courier,monospace"
    font-size="22"
    fill="#4ade80"
    text-anchor="middle"
    opacity="0">
    I code because I can.
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- Terminal prompt — appears last -->
  <text
    x="28" y="385"
    font-family="'Courier New',Courier,monospace"
    font-size="18"
    fill="#4ade80"
    opacity="0">logesh@dev:~$
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.0s" fill="freeze"/>
  </text>

  <!-- Blinking block cursor -->
  <rect x="196" y="367" width="11" height="20" fill="#4ade80" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
